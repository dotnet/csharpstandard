name: Renumber standard TOC

# Triggers the workflow on pull request events that update the branch
on: 
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual run'

jobs:
  renumber-sections:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true

    steps:
    - name: Check out our repo
      uses: actions/checkout@v7.0.1

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Run section renumbering dry run
      env:
        DIAGNOSTICS_REPORT_PATH: ${{ runner.temp }}/reports/renumber-sections.json
      run: |
        cd tools
        ./run-section-renumber.sh

    - name: Upload diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: section-renumber-diagnostics
        path: ${{ runner.temp }}/reports/
        if-no-files-found: warn
