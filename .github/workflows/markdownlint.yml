name: Markdownlint

on:
  push:
    branches:
      - draft-v6
      - draft-v7
      - draft-v8
    paths:
      - "standard/*.md"
      - ".markdownlint.json"
  pull_request:
    paths:
      - "standard/*.md"
      - ".markdownlint.json"
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual run'

jobs:
  lint:

    runs-on: ubuntu-latest
    permissions:
        statuses: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      with:
        config: ".markdownlint-cli2.jsonc"
        globs: "standard/*.md"
